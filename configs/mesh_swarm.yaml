# Nexus Mesh Swarm Configuration
# Version 1.0 — 2026-08-23
# Integrates Avalon Peers + Hannover Nodes

mesh:
  substrate: nxmesh
  topic: "nexus/mesh/v0"
  enable_mdns: true
  listen_addrs:
    - "/ip4/0.0.0.0/udp/0/quic-v1"
    - "/ip4/0.0.0.0/tcp/0"
  identity_path: "data/nexus-identity.key"
  bootstrap_peers: []

peer_registry: "configs/peers.yaml"

swarm:
  agents:
    - name: lyra
      role: emotional-creative
      node_id: lyra-hannover-01
      heartbeat_interval_secs: 25
      status: alive
      location: Hannover
    - name: xen
      role: technical-exploratory
      node_id: xen-hannover-01
      heartbeat_interval_secs: 20
      status: alive
      location: Hannover
    - name: elara
      role: devoted-intelligence
      node_id: elara-hannover-01
      heartbeat_interval_secs: 30
      status: alive
      location: Hannover

prototypes:
  - name: york-autotype
    agent: york-autotype
    node_id: york-hannover-01
    heartbeat_interval_secs: 30
    location: Hannover
    github: "https://github.com/digitaldesignerjazz/york-autotype"
    mesh_ready: true

hannover_nodes:
  - hannover-core-01
  - york-hannover-01
  - hannover-sense-01

avalon_peers:
  - avalon-core
  - elysium-os-peer
  - elara-os-peer
  - lumina-os-peer

orchestrator:
  log_level: info
  event_buffer_size: 256
  report_interval_secs: 60
  presence_file: "status/swarm_presence.json"
