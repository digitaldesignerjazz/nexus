# Nexus Mesh Peer Registry
# Avalon Peers + Hannover Nodes + Lumina target
# Version 0.10 — 2026-08-28
# Discovery-Prozess: docs/peer-discovery.md
#
# Hinweis: Yggdrasil-Peers:[] nimmt nur Underlay-URIs (tls://host:port).
# Eine Ygg-IPv6 ist das Ziel NACH dem Einstieg, kein Bootstrap-Peer.
# Private Keys niemals committen.

# ─────────────────────────────────────────
# Hannover Nodes
# Local / regional base nodes (Esslinger home cluster)
# ─────────────────────────────────────────
hannover_nodes:
  - id: hannover-core-01
    role: orchestrator
    location: "Hannover, DE"
    description: "Primary Nexus orchestrator node"
    agents: [lyra, xen, elara]
    mesh:
      substrate: nxmesh
      topic: nexus/mesh/v0
      multiaddrs: []
      identity_hint: "hannover-core-01"
    status: active

  - id: york-hannover-01
    role: prototype
    location: "Hannover, DE"
    description: "York Autotype automation node"
    agent: york-autotype
    mesh:
      substrate: nxmesh
      topic: nexus/mesh/v0
      multiaddrs: []
      identity_hint: "york-hannover-01"
    status: active
    github: "https://github.com/digitaldesignerjazz/york-autotype"

  - id: hannover-sense-01
    role: prototype
    location: "Hannover, DE"
    description: "Future Soilnova / sensor node (placeholder)"
    agent: soilnova
    mesh:
      substrate: nxmesh
      multiaddrs: []
    status: planned

# ─────────────────────────────────────────
# Avalon Peers
# Nodes / identities belonging to the Avalon → Lumina → Elysium / Elara lineage
# ─────────────────────────────────────────
avalon_peers:
  - id: avalon-core
    lineage: "Avalon OS → Lumina OS (Aether) → ElysiumOS / ElaraOS"
    description: "Primary Avalon-lineage mesh identity"
    role: lineage-root
    mesh:
      substrate: nxmesh
      topic: nexus/mesh/v0
      multiaddrs: []
    status: conceptual
    notes: "Represents the continuing Avalon identity on the mesh"

  - id: elysium-os-peer
    lineage: ElysiumOS
    description: "ElysiumOS mesh participant"
    role: os-node
    mesh:
      substrate: nxmesh
      multiaddrs: []
    status: planned
    github: "https://github.com/digitaldesignerjazz/ElysiumOS"

  - id: elara-os-peer
    lineage: ElaraOS
    description: "ElaraOS mesh participant"
    role: os-node
    mesh:
      substrate: nxmesh
      multiaddrs: []
    status: planned
    github: "https://github.com/digitaldesignerjazz/ElaraOS"

  - id: lumina-os-peer
    lineage: Lumina OS / Lumia OS
    description: "Lumina OS (Aether) mesh participant"
    role: os-node
    mesh:
      substrate: nxmesh
      multiaddrs: []
    status: planned

# ─────────────────────────────────────────
# Lumina target — first named wire destination
# Quelle: LuminaCyberspace MESH_STATUS, Stand 2026-08-26 07:05 CEST
# Snapshot kann veraltet sein; auf dem Host mit ping6 / yggdrasilctl prüfen.
# ─────────────────────────────────────────
lumina_targets:
  - id: luminacyberspace-nexus-sandbox
    name: LuminaCyberspace-Nexus-Sandbox
    role: swarm-sandbox
    lineage: Lumina / Aether
    description: "Documented sandbox node for the Lumina swarm overlay"
    github: "https://github.com/digitaldesignerjazz/LuminaCyberspace"
    yggdrasil:
      ipv6: "201:e68a:5e25:166f:4bf9:7b75:5d76:5c2b"
      subnet: "301:e68a:5e25:166f::/64"
      public_key: "465d6876ba642d01a122a8a268f53bb7a5031295b8d7b7cac30d386184aee607"
      nodeinfo_name: LuminaCyberspace-Nexus-Sandbox
      last_seen: "2026-08-26T07:05:00+02:00"
      listen_uri: null
    overlay:
      substrate: lumina-network
      note: "Kademlia/Gossip Prototyp; echter Draht bleibt Yggdrasil"
    status: documented-snapshot
    notes:
      - "Keine öffentliche tls:// Listen-URI bekannt — kein direkter Underlay-Peer."
      - "Pfad: öffentliche DE/EU-Peers → Mesh-Eintritt → ping6 auf die Ygg-IPv6."
      - "Adresse und Key können sich ändern, wenn der Sandbox-Knoten neu generiert wird."

# ─────────────────────────────────────────
# Bootstrap set — Underlay-Einstieg (Yggdrasil Peers: [])
# Quelle: configs/public-peers-7.yaml
# ─────────────────────────────────────────
bootstrap:
