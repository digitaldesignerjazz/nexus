name: SBOM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SBOM (CycloneDX)
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: nexus-sbom.cdx.json
          upload-artifact: false

      - name: Ensure SBOM artifact exists
        run: |
          if [ ! -s nexus-sbom.cdx.json ]; then
            echo '{"bomFormat":"CycloneDX","specVersion":"1.6","version":1,"components":[]}' > nexus-sbom.cdx.json
            echo "Wrote fallback empty SBOM"
          fi
          ls -la nexus-sbom.cdx.json

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-sbom
          path: nexus-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30
