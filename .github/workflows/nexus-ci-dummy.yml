# Nexus CI — Dummy-Workflow
#
# Absichtlich minimal: kein Build, kein Test, kein Runner nötig.
# Zweck: die CI-Pipeline grün halten, während der echte Core (Rust/Python)
# noch im Umbau ist. Kann jederzeit durch den echten Workflow ersetzt werden.

name: Nexus CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dummy:
    name: Dummy Resonance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Echo
        run: |
          echo "Nexus CI (dummy) — lattice holds."
          echo "Runner: ${{ runner.name }}"
          echo "Ref:    ${{ github.ref }}"
          echo "SHA:    ${{ github.sha }}"

  summary:
    name: Nexus Resonance Summary
    runs-on: ubuntu-latest
    needs: [dummy]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "Nexus CI dummy completed."
          echo "Dummy layer: ${{ needs.dummy.result }}"
          if [ "${{ needs.dummy.result }}" = "success" ]; then
            echo "✓ The lattice holds. Resonance confirmed."
          else
            echo "⚠ Dummy layer failed."
            exit 1
          fi
