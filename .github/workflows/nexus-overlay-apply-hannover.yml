name: Nexus Overlay Apply — Hannover

# Echter Yggdrasil-Start auf dem Hannover-Self-Hosted-Runner.
# Läuft NUR dort: braucht /dev/net/tun, NET_ADMIN, privilegierten Zugriff.
# GitHub-hosted Runner (ubuntu-latest) kann das nicht — der Fallback
# bleibt bewusst ein No-op mit klarer Meldung.
#
# Dispatch:
#   gh workflow run nexus-overlay-apply-hannover.yml -f action=start
#   gh workflow run nexus-overlay-apply-hannover.yml -f action=status
#   gh workflow run nexus-overlay-apply-hannover.yml -f action=stop

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Overlay-Aktion'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - status
          - stop
          - restart
      ygg_version:
        description: 'Yggdrasil-Version (GitHub-Release-Tag, ohne v)'
        required: false
        default: '0.5.14'

concurrency:
  group: nexus-overlay-hannover
  cancel-in-progress: false

env:
  YGG_VERSION: ${{ inputs.ygg_version || '0.5.14' }}
  YGG_CONF: /etc/yggdrasil/yggdrasil.conf
  YGG_DEB: /tmp/yggdrasil-${{ inputs.ygg_version || '0.5.14' }}-amd64.deb
  YGG_URL: https://github.com/yggdrasil-network/yggdrasil-go/releases/download/v${{ inputs.ygg_version || '0.5.14' }}/yggdrasil-${{ inputs.ygg_version || '0.5.14' }}-amd64.deb

jobs:
  apply:
    name: Overlay Apply · ${{ inputs.action }}
    runs-on: [self-hosted, linux, hannover]
    # Nur Hannover. Kein hosted-Fallback mehr — der Job wartet in der Queue,
    # bis der Self-Hosted-Runner online ist. Keine stillen No-ops.
    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v4

      - name: Runner-Umgebung prüfen
        id: env
        run: |
          set -euo pipefail
          echo "Runner: $(hostname)"
          echo "Arch:   $(uname -m)"
          echo "Kernel: $(uname -r)"
          if [ -c /dev/net/tun ]; then
            echo "tun=yes" >> "$GITHUB_OUTPUT"
            echo "/dev/net/tun vorhanden — Hannover-Knoten bestätigt."
          else
            echo "tun=no" >> "$GITHUB_OUTPUT"
            echo "::error::/dev/net/tun fehlt. Kein Hannover-Knoten — Job bricht ab."
            exit 1
          fi
          if command -v docker >/dev/null 2>&1; then
            echo "docker=yes" >> "$GITHUB_OUTPUT"
          else
            echo "docker=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Yggdrasil Binary laden (DEB)
        if: inputs.action == 'start' || inputs.action == 'restart'
        run: |
          set -euo pipefail
          echo "Lade Yggdrasil v${YGG_VERSION} ..."
          curl -fsSL -o "$YGG_DEB" "$YGG_URL"
          echo "SHA256: $(sha256sum "$YGG_DEB")"
          # Erwarteter Hash für 0.5.14-amd64 (Release 2026-06-19):
          EXPECTED="72745496b09baa1c3f5a6741e1257a704cfdb9d00cdf3ddbef025987b239699d"
          ACTUAL="$(sha256sum "$YGG_DEB" | awk '{print $1}')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Checksum mismatch! Erwartet $EXPECTED, erhalten $ACTUAL"
            exit 1
          fi
          echo "Checksum OK."

      - name: Installieren
        if: inputs.action == 'start' || inputs.action == 'restart'
        run: |
          set -euo pipefail
          dpkg -i "$YGG_DEB" || apt-get install -f -y
          yggdrasil -version
          # systemd-Unit sicherstellen
          systemctl daemon-reload || true
          systemctl enable yggdrasil || true

      - name: Config anlegen (falls fehlt)
        if: inputs.action == 'start' || inputs.action == 'restart'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$YGG_CONF")"
          if [ ! -f "$YGG_CONF" ]; then
            echo "Keine Config — erzeuge frische (Private Key bleibt lokal)."
            yggdrasil -genconf > "$YGG_CONF"
            chmod 600 "$YGG_CONF"
          else
            echo "Bestehende Config: $YGG_CONF"
          fi
          # NodeInfo für Nexus kennzeichnen
          if ! grep -q 'name: "nexus-control-hannover"' "$YGG_CONF"; then
            sed -i 's/name: "Nexus Node"/name: "nexus-control-hannover"/' "$YGG_CONF" || true
          fi
          echo "— Config-Kopf —"
          head -n 20 "$YGG_CONF"

      - name: Daemon ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "${{ inputs.action }}" in
            start)
              systemctl start yggdrasil
              echo "Yggdrasil gestartet."
              ;;
            stop)
              systemctl stop yggdrasil || true
              echo "Yggdrasil gestoppt."
              ;;
            restart)
              systemctl restart yggdrasil
              echo "Yggdrasil neu gestartet."
              ;;
            status)
              systemctl status yggdrasil --no-pager || true
              ;;
          esac
          sleep 3

      - name: Status & Adresse
        if: inputs.action != 'stop'
        run: |
          set -euo pipefail
          echo "=== yggdrasilctl getSelf ==="
          yggdrasilctl getSelf || true
          echo
          echo "=== yggdrasilctl getPeers ==="
          yggdrasilctl getPeers || true
          echo
          echo "=== Overlay-Adresse ==="
          yggdrasil -useconffile "$YGG_CONF" -address || true

      - name: Summary
        if: always()
        run: |
          {
            echo "## Nexus Overlay · Hannover"
            echo "- Aktion: `${{ inputs.action }}`"
            echo "- Version: `v${YGG_VERSION}`"
            echo "- Runner: `$(hostname)`"
            echo "- Config: `$YGG_CONF`"
            echo "- Status: `$(systemctl is-active yggdrasil 2>/dev/null || echo unknown)`"
          } >> "$GITHUB_STEP_SUMMARY"
