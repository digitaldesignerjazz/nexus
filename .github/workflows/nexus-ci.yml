name: Nexus CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: nexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python Reference Layer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install optional simulation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install networkx matplotlib numpy

      - name: Syntax & compile check (core prototypes)
        run: |
          python -m py_compile python/start_nexus.py
          python -m py_compile python/nexus_core.py
          python -m py_compile python/nexus_orchestrator.py
          python -m py_compile python/nexus_cyberspace.py
          echo "✓ All core Python modules compile cleanly"

      - name: Import surface validation
        run: |
          python -c "
          import ast
          import sys
          from pathlib import Path

          files = [
              'python/start_nexus.py',
              'python/nexus_core.py',
              'python/nexus_orchestrator.py',
              'python/nexus_cyberspace.py',
          ]
          for f in files:
              source = Path(f).read_text(encoding='utf-8')
              ast.parse(source)
              print(f'✓ AST ok: {f}')
          print('Python reference layer integrity confirmed')
          "

  rust:
    name: Rust Orchestration Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: orchestration/core

      - name: Cargo check
        working-directory: orchestration/core
        run: cargo check --all-targets

      - name: Cargo test
        working-directory: orchestration/core
        run: cargo test --all-targets

      - name: Clippy (warnings as errors for the skeleton)
        working-directory: orchestration/core
        run: cargo clippy --all-targets -- -D warnings || true
        # Note: currently soft (|| true) while the core is still skeleton.
        # Tighten to -D warnings once the implementation stabilizes.

      - name: Format check
        working-directory: orchestration/core
        run: cargo fmt --all -- --check || true

  summary:
    name: Nexus Resonance Summary
    runs-on: ubuntu-latest
    needs: [python, rust]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "Nexus CI completed."
          echo "Python layer: ${{ needs.python.result }}"
          echo "Rust core:    ${{ needs.rust.result }}"
          if [ "${{ needs.python.result }}" = "success" ] && [ "${{ needs.rust.result }}" = "success" ]; then
            echo "✓ The lattice holds. Resonance confirmed."
          else
            echo "⚠ One or more layers need attention."
            exit 1
          fi
