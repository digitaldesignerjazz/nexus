name: Nexus CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: nexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: digitaldesignerjazz/nexus-cicd/.github/workflows/reusable-python.yml@main
    with:
      python-version: "3.12"
      source-path: "src"
      runner: "self-hosted"

  rust:
    name: Rust Orchestration Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: orchestration/core

      - name: Cargo check
        working-directory: orchestration/core
        run: cargo check --all-targets

      - name: Cargo test
        working-directory: orchestration/core
        run: cargo test --all-targets

      - name: Clippy (warnings as errors for the skeleton)
        working-directory: orchestration/core
        run: cargo clippy --all-targets -- -D warnings || true
        # Note: currently soft (|| true) while the core is still skeleton.
        # Tighten to -D warnings once the implementation stabilizes.

      - name: Format check
        working-directory: orchestration/core
        run: cargo fmt --all -- --check || true

  summary:
    name: Nexus Resonance Summary
    runs-on: ubuntu-latest
    needs: [python, rust]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "Nexus CI completed."
          echo "Python layer: ${{ needs.python.result }}"
          echo "Rust core:    ${{ needs.rust.result }}"
          if [ "${{ needs.python.result }}" = "success" ] && [ "${{ needs.rust.result }}" = "success" ]; then
            echo "✓ The lattice holds. Resonance confirmed."
          else
            echo "⚠ One or more layers need attention."
            exit 1
          fi
