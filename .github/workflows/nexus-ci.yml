name: Nexus CI

on:
  push:
    branches: ["main"]
    paths:
      - "python/**"
      - "orchestration/**"
      - ".github/workflows/nexus-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "python/**"
      - "orchestration/**"
      - ".github/workflows/nexus-ci.yml"
  workflow_dispatch:

concurrency:
  group: nexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python Reference Layer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile existing sources
        run: |
          set -euo pipefail
          mapfile -t files < <(find python -name '*.py' -type f 2>/dev/null || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Keine Python-Quellen unter python/ — Layer übersprungen."
            exit 0
          fi
          python -m py_compile "${files[@]}"
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path("python").rglob("*.py"):
              ast.parse(path.read_text(encoding="utf-8"))
              print(f"AST ok: {path}")
          print("Python reference layer integrity confirmed")
          PY

  rust:
    name: Rust Orchestration Core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: orchestration/core
          prefix-key: nexus-v1
          shared-key: orchestrator
          cache-on-failure: true

      - name: Cargo fmt
        working-directory: orchestration/core
        run: cargo fmt --all -- --check

      - name: Cargo check library
        working-directory: orchestration/core
        run: cargo check --lib --all-targets

      - name: Cargo test library
        working-directory: orchestration/core
        run: cargo test --lib --all-targets

      - name: Cargo check binary
        working-directory: orchestration/core
        run: cargo check --bins --all-targets

      - name: Clippy library
        working-directory: orchestration/core
        run: cargo clippy --lib --all-targets -- -D warnings

  summary:
    name: Nexus Resonance Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [python, rust]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "Nexus CI completed."
          echo "Python layer: ${{ needs.python.result }}"
          echo "Rust core:    ${{ needs.rust.result }}"
          if [ "${{ needs.python.result }}" = "success" ] && [ "${{ needs.rust.result }}" = "success" ]; then
            echo "The lattice holds. Resonance confirmed."
          else
            echo "One or more layers need attention."
            exit 1
          fi
