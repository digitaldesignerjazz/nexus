version: 2
updates:
  # GitHub Actions — keep the CI/CD lattice itself current and secure
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
      - "github-actions"
      - "nexus-ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-security:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Rust orchestration core
  - package-ecosystem: "cargo"
    directory: "/orchestration/core"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
      - "security"
      - "rust"
      - "orchestration"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Major version bumps remain manual while the core is still forming.
    # Security updates (even major) will still be proposed by GitHub's security alerts.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python reference layer (prepared)
  # Dormant until a requirements*.txt, pyproject.toml, or Pipfile appears in /python
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
      - "python"
      - "reference-layer"
    commit-message:
      prefix: "deps"
      include: "scope"
